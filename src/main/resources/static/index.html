<!DOCTYPE html>
<html>
<head><title>Live Order Demo</title></head>
<body>
<h1>Live Order Status</h1>
<div id="status">Waiting for order...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script>
    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);
    stompClient.connect({}, function(frame) {
        console.log('Connected: ' + frame);
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        if (!orderId) {
            document.getElementById('status').innerHTML = '<h2>No orderId in URL</h2>';
            return;
        }
        console.log('Subscribing to /topic/order/' + orderId);
        stompClient.subscribe('/topic/order/' + orderId, function(msg) {
            console.log('Received message:', msg.body);
            const update = JSON.parse(msg.body);
            document.getElementById('status').innerHTML = '<h2>' + update.status + '</h2>';
        });
        document.getElementById('status').innerHTML = '<h2>Connected - waiting for updates...</h2>';
    }, function(error) {
        console.error('STOMP error', error);
        document.getElementById('status').innerHTML = '<h2>Connection failed</h2>';
    });
</script>
</body>
</html>
