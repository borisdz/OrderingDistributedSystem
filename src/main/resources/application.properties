spring.application.name=OrderingDistributedSystem
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:17111/orders
spring.datasource.username=boris
spring.datasource.password=b17i19
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=order-service-responses
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.distributed.order.events

spring.data.redis.host=localhost
spring.data.redis.port=6379

logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG

otel.service.name=ordering-service
management.endpoints.web.exposure.include=health,metrics,prometheus
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4317
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.step=10s

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.level.root=INFO